# GoReleaser configuration for terraform-provider-vayucloud
#
# This configuration is used for automated releases when publishing
# the provider to the Terraform Registry or GitHub Releases.
#
# For more information: https://goreleaser.com/

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos:
      - freebsd
      - linux
      - darwin
      - windows
      - openbsd
      - solaris
    goarch:
      - "386"
      - amd64
      - arm64
      - arm
      - s390x
    goarm:
      # Single GOARM only: both 6 and 7 produce Arch=arm and collide on
      # {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.zip
      - "7"
    ignore:
      # FreeBSD: 386, amd64, arm
      - goos: freebsd
        goarch: arm64
      - goos: freebsd
        goarch: s390x

      # Linux: 386, amd64, arm, arm64, s390x
      # No exclusions

      # Darwin: amd64, arm64
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: s390x

      # Windows: 386, amd64, arm64
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: s390x

      # OpenBSD: 386, amd64
      - goos: openbsd
        goarch: arm
      - goos: openbsd
        goarch: arm64
      - goos: openbsd
        goarch: s390x

      # Solaris: amd64
      - goos: solaris
        goarch: "386"
      - goos: solaris
        goarch: arm
      - goos: solaris
        goarch: arm64
      - goos: solaris
        goarch: s390x

    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - format: zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # GPG signing for Terraform Registry
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  # GitHub release configuration
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## VayuCloud Terraform Provider {{ .Version }}

    ### Installation

    ```hcl
    terraform {
      required_providers {
        vayucloud = {
          source  = "tatacommunicationsvayu/vayucloud"
          version = "{{ .Version }}"
        }
      }
    }
    ```

  footer: |
    **Full Changelog**: https://github.com/tatacommunications/terraform-provider-vayucloud/compare/{{ .PreviousTag }}...{{ .Tag }}

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: 'New Features'
      regexp: '^.*?feat(\(.+\))?\!?:.+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\(.+\))?\!?:.+$'
      order: 1
    - title: 'Other'
      order: 999

