# Terraform Provider release workflow.
#
# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created. It builds the provider binaries for all
# supported platforms, signs the checksums with GPG, and publishes them
# as a GitHub Release for the Terraform Registry to consume.
#
# Prerequisites:
#   - GPG_PRIVATE_KEY: Repository secret containing the ASCII-armored GPG private key
#   - PASSPHRASE: Repository secret containing the GPG key passphrase
#
# Reference:
#   - https://github.com/terraform-provider-openstack/terraform-provider-openstack
#   - https://github.com/hashicorp/terraform-provider-scaffolding-framework

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # Release tags
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+" # Release candidate tags

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
